services:
  # Backend API Web Service
  - type: web
    name: vendorflow-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: mongodb+srv://formula1fancode_db_user:eFimJHtobcDEU4Pd@vendor.4yyu36a.mongodb.net/vendorflow?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"

  # Frontend Static Site
  - type: static
    name: vendorflow-client
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://vendorflow-api.onrender.com/api


